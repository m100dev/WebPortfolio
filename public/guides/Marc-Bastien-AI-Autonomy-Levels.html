<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─── Reset ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Surface */
  --bg:        #050507;
  --surface-1: #0C0C10;
  --surface-2: #131318;
  --surface-3: #1A1A20;
  --surface-4: #222229;

  /* Text */
  --ink:       #EAE6DD;
  --ink-2:     #A09B90;
  --ink-3:     #6B665C;
  --ink-4:     #3D3A34;

  /* Accent */
  --gold:      #C8A44E;
  --gold-dim:  rgba(200,164,78,.08);
  --gold-soft: rgba(200,164,78,.15);

  /* Level palettes */
  --c1: #6FA8D0; --c1-bg: #0A1824; --c1s: rgba(111,168,208,.10); --c1b: rgba(111,168,208,.18);
  --c2: #9084CF; --c2-bg: #130F28; --c2s: rgba(144,132,207,.10); --c2b: rgba(144,132,207,.18);
  --c3: #48B593; --c3-bg: #081E18; --c3s: rgba(72,181,147,.10);  --c3b: rgba(72,181,147,.18);
  --c4: #CF7E54; --c4-bg: #1C120C; --c4s: rgba(207,126,84,.10);  --c4b: rgba(207,126,84,.18);
  --c5: #C8A44E; --c5-bg: #1A1508; --c5s: rgba(200,164,78,.10);  --c5b: rgba(200,164,78,.18);

  /* Type */
  --sans:    'Outfit', system-ui, -apple-system, sans-serif;
  --display: 'Newsreader', Georgia, serif;

  /* Space */
  --r:  16px;
  --rs: 10px;
  --ease: cubic-bezier(.22, 1, .36, 1);
}

html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
::selection { background: var(--gold-soft); color: var(--ink); }
a { color: inherit; text-decoration: none; }


/* ═══════════════════════════════════════════
   HERO
   ═══════════════════════════════════════════ */
.hero {
  position: relative;
  padding: 7rem 2rem 4rem;
  text-align: center;
  overflow: hidden;
}

/* Atmospheric glow */
.hero::before {
  content: '';
  position: absolute;
  top: -200px;
  left: 50%;
  transform: translateX(-50%);
  width: 900px;
  height: 600px;
  background: radial-gradient(ellipse 55% 55%, rgba(200,164,78,.06) 0%, transparent 70%);
  pointer-events: none;
}

/* Subtle grain overlay */
.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");
  pointer-events: none;
  opacity: .5;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 2rem;
  position: relative;
  z-index: 1;
}
.hero-eyebrow::before,
.hero-eyebrow::after {
  content: '';
  width: 40px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: .35;
}

.hero h1 {
  position: relative;
  z-index: 1;
  font-family: var(--display);
  font-size: clamp(2.6rem, 6vw, 4rem);
  font-weight: 300;
  font-style: italic;
  color: var(--ink);
  line-height: 1.15;
  margin-bottom: 1rem;
  letter-spacing: -.02em;
}
.hero h1 strong {
  font-weight: 400;
  color: var(--gold);
}

.hero-sub {
  position: relative;
  z-index: 1;
  font-size: clamp(1rem, 1.8vw, 1.15rem);
  color: var(--ink-2);
  max-width: 520px;
  margin: 0 auto 3rem;
  line-height: 1.75;
  font-weight: 300;
}

/* Progress chips */
.chips {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 400;
  padding: 8px 18px;
  border-radius: 100px;
  border: 1px solid var(--surface-4);
  background: var(--surface-1);
  color: var(--ink-2);
  cursor: pointer;
  transition: all .3s var(--ease);
}
.chip:hover { border-color: var(--ink-4); background: var(--surface-2); }
.chip-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink-4);
  transition: all .4s var(--ease);
}
.chip.done .chip-dot { background: var(--gold); box-shadow: 0 0 8px var(--gold-dim); }
.chip.done { border-color: rgba(200,164,78,.2); color: var(--gold); }
.chip-pct { font-size: 10px; opacity: .45; font-weight: 600; margin-left: 2px; }


/* ═══════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════ */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 2rem;
}


/* ═══════════════════════════════════════════
   LEVEL SECTIONS
   ═══════════════════════════════════════════ */
.level {
  padding: 3rem 0 2rem;
  opacity: 0;
  transform: translateY(30px);
  transition: opacity .7s var(--ease), transform .7s var(--ease);
}
.level.vis { opacity: 1; transform: none; }

.sep {
  height: 1px;
  margin: 1.5rem 0 3rem;
  background: linear-gradient(90deg, transparent, var(--surface-4) 35%, var(--surface-4) 65%, transparent);
}

/* Level header */
.lv-head {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 2.5rem;
}
.lv-num {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--display);
  font-size: 24px;
  font-weight: 500;
  flex-shrink: 0;
  border: 1px solid;
  position: relative;
}
.lv-num::after {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 16px;
  opacity: .3;
  filter: blur(12px);
  z-index: -1;
}

.lv-meta h2 {
  font-family: var(--display);
  font-size: clamp(1.4rem, 2.8vw, 1.75rem);
  font-weight: 400;
  font-style: italic;
  color: var(--ink);
  margin-bottom: 8px;
}
.lv-meta p {
  font-size: 14.5px;
  color: var(--ink-2);
  line-height: 1.75;
  font-weight: 300;
  max-width: 680px;
}


/* ═══════════════════════════════════════════
   WORKFLOW DIAGRAM
   ═══════════════════════════════════════════ */
.diagram {
  background: var(--surface-1);
  border: 1px solid var(--surface-4);
  border-radius: var(--r);
  padding: 2rem;
  margin-bottom: 1.75rem;
  position: relative;
  overflow: hidden;
}

/* Subtle corner glow */
.diagram::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  filter: blur(80px);
  opacity: .04;
  pointer-events: none;
}

.dia-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  gap: 10px;
}
.dia-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.dia-legend {
  display: flex;
  gap: 20px;
}
.leg {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  font-weight: 400;
  color: var(--ink-3);
}
.leg-box {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}

/* Flow row */
.flow {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 8px 0;
  position: relative;
  z-index: 1;
}

/* Connecting line behind nodes */
.flow::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 24px;
  right: 24px;
  height: 2px;
  border-radius: 1px;
  z-index: 0;
}

.node {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  flex: 1;
  position: relative;
  z-index: 1;
  padding: 0 4px;
}

.node-circle {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .3s var(--ease), box-shadow .3s var(--ease);
  position: relative;
}
.node:hover .node-circle {
  transform: translateY(-3px);
}
.node-circle svg {
  width: 22px;
  height: 22px;
  stroke-width: 1.6;
}

/* "YOU" badge on human nodes */
.node.human .node-circle::after {
  content: 'YOU';
  position: absolute;
  top: -6px;
  right: -8px;
  font-size: 7px;
  font-weight: 700;
  letter-spacing: .1em;
  padding: 2px 5px;
  border-radius: 4px;
  line-height: 1;
}

.node-text {
  font-size: 11px;
  font-weight: 500;
  line-height: 1.3;
  text-align: center;
  letter-spacing: .01em;
}

/* Arrow between nodes */
.arr {
  flex: 0 0 auto;
  width: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
}
.arr svg {
  width: 16px;
  height: 16px;
  opacity: .15;
}


/* ═══════════════════════════════════════════
   INFO CARDS
   ═══════════════════════════════════════════ */
.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin-bottom: 1.75rem;
}
@media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }

.card {
  background: var(--surface-1);
  border: 1px solid var(--surface-4);
  border-radius: var(--r);
  padding: 1.5rem;
  transition: border-color .3s var(--ease);
}
.card:hover { border-color: var(--ink-4); }

.card-hd {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 1rem;
}
.card-ico {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-ico svg { width: 15px; height: 15px; stroke-width: 1.6; }
.card-title { font-size: 14px; font-weight: 500; color: var(--ink); }

.card ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.card li {
  display: flex;
  align-items: baseline;
  gap: 12px;
  font-size: 13.5px;
  color: var(--ink-2);
  line-height: 1.6;
  font-weight: 300;
}
.card li::before {
  content: '';
  width: 5px;
  height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 8px;
}


/* ═══════════════════════════════════════════
   SKILL CHECKLIST
   ═══════════════════════════════════════════ */
.checklist {
  background: var(--surface-1);
  border: 1px solid var(--surface-4);
  border-radius: var(--r);
  padding: 1.75rem;
  margin-bottom: 1.75rem;
}

.cl-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.cl-label {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 10px;
}
.cl-label svg { width: 18px; height: 18px; stroke-width: 1.6; }
.cl-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 100px;
  letter-spacing: .02em;
}

.cl-track {
  height: 4px;
  background: var(--surface-3);
  border-radius: 2px;
  margin-bottom: 18px;
  overflow: hidden;
}
.cl-fill {
  height: 100%;
  border-radius: 2px;
  transition: width .5s var(--ease);
}

.cl-row {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 10px 0;
  border-bottom: 1px solid var(--surface-3);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: opacity .15s;
}
.cl-row:last-child { border-bottom: none; }
.cl-row:hover { opacity: .75; }

.cl-check {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  border: 1.5px solid var(--surface-4);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
  transition: all .25s var(--ease);
}
.cl-check svg {
  width: 12px;
  height: 12px;
  stroke-width: 2.5;
  stroke: var(--bg);
  fill: none;
  opacity: 0;
  transition: opacity .2s;
}
.cl-check.on svg { opacity: 1; }

.cl-txt {
  font-size: 13.5px;
  color: var(--ink-2);
  line-height: 1.6;
  font-weight: 300;
  transition: all .25s;
}
.cl-txt.done {
  text-decoration: line-through;
  color: var(--ink-4);
}


/* ═══════════════════════════════════════════
   NEXT STEPS
   ═══════════════════════════════════════════ */
.nextsteps {
  background: var(--surface-1);
  border: 1px solid var(--surface-4);
  border-radius: var(--r);
  padding: 1.75rem;
  margin-bottom: 1.75rem;
}

.ns-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}
.ns-title svg { width: 18px; height: 18px; stroke-width: 1.6; }

.ns-item {
  display: flex;
  gap: 16px;
}
.ns-rail {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 16px;
  flex-shrink: 0;
}
.ns-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid;
  flex-shrink: 0;
}
.ns-line {
  width: 1.5px;
  flex: 1;
  min-height: 16px;
}
.ns-body { padding-bottom: 16px; }
.ns-body strong {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink);
  display: block;
  margin-bottom: 3px;
}
.ns-body span {
  font-size: 12.5px;
  color: var(--ink-3);
  line-height: 1.55;
  font-weight: 300;
}


/* ═══════════════════════════════════════════
   NAVIGATION LINK
   ═══════════════════════════════════════════ */
.go-next {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--surface-1);
  border: 1px solid var(--surface-4);
  border-radius: var(--r);
  padding: 1.1rem 1.5rem;
  margin-bottom: 1rem;
  cursor: pointer;
  transition: all .3s var(--ease);
}
.go-next:hover {
  border-color: var(--ink-4);
  transform: translateX(4px);
}
.go-badge {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--display);
  font-size: 17px;
  font-weight: 500;
  flex-shrink: 0;
}
.go-text { flex: 1; }
.go-sub {
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: .08em;
}
.go-name {
  font-size: 14.5px;
  font-weight: 500;
  color: var(--ink);
  margin-top: 2px;
}
.go-next svg {
  width: 18px;
  height: 18px;
  color: var(--ink-4);
  flex-shrink: 0;
  transition: transform .3s var(--ease);
}
.go-next:hover svg { transform: translateX(3px); }


/* ═══════════════════════════════════════════
   FOOTER
   ═══════════════════════════════════════════ */
footer {
  text-align: center;
  padding: 4rem 2rem 3rem;
  font-size: 12px;
  color: var(--ink-4);
  border-top: 1px solid var(--surface-3);
  margin-top: 3rem;
}
footer a { color: var(--gold); opacity: .5; transition: opacity .2s; }
footer a:hover { opacity: 1; }


/* ═══════════════════════════════════════════
   ANIMATIONS
   ═══════════════════════════════════════════ */
@keyframes up {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: none; }
}
.hero-eyebrow, .hero h1, .hero-sub, .chips {
  animation: up .65s var(--ease) both;
}
.hero h1   { animation-delay: .1s; }
.hero-sub  { animation-delay: .2s; }
.chips     { animation-delay: .3s; }


/* ═══════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════ */
@media (max-width: 680px) {
  .hero { padding: 4.5rem 1.25rem 3rem; }
  .container { padding: 0 1.25rem; }
  .flow { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
  .node-circle { width: 42px; height: 42px; border-radius: 12px; }
  .node-circle svg { width: 18px; height: 18px; }
  .node-text { font-size: 9.5px; }
  .arr { width: 16px; }
  .arr svg { width: 12px; height: 12px; }
  .lv-num { width: 46px; height: 46px; font-size: 20px; }
}
</style>
</head>
<body>

<!-- ═══ HERO ═══ -->
<header class="hero">
  <div class="hero-eyebrow">Framework for AI Engineers</div>
  <h1>The five levels of<br><strong>AI autonomy</strong></h1>
  <p class="hero-sub">A practical guide for measuring your growth from AI-assisted coding to fully autonomous multi-agent orchestration. Track skills as you master them.</p>
  <p style="font-size:12px;color:var(--ink-4);margin-bottom:2rem;position:relative;z-index:1">by <a href="https://www.linkedin.com/in/marcbastien001" target="_blank" rel="noopener" style="color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;transition:color .2s">Marc Bastien</a></p>
  <nav class="chips" id="chips"></nav>
</header>

<!-- ═══ CONTENT ═══ -->
<main class="container" id="main"></main>

<!-- ═══ FOOTER ═══ -->
<footer>
  <div style="margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap">
    <span>© 2026 Marc Bastien</span>
    <span style="color:var(--surface-4)">·</span>
    <a href="https://www.linkedin.com/in/marcbastien001" target="_blank" rel="noopener" style="color:var(--gold);opacity:.6;transition:opacity .2s" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='.6'">LinkedIn</a>
    <span style="color:var(--surface-4)">·</span>
    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener" style="color:var(--ink-3);opacity:.5;transition:opacity .2s" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='.5'">CC BY 4.0</a>
  </div>
</footer>


<!-- ═══════════════════════════════════════════
     DATA + RENDERING ENGINE
     ═══════════════════════════════════════════ -->
<script>
/* ── Icons (inline SVG, no external deps) ── */
const S = (d, sw) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||1.6}">${d}</svg>`;
const IC = {
  check:     S('<path d="M5 12l5 5L20 7"/>',2.2),
  chevR:     S('<path d="M9 6l6 6-6 6"/>'),
  arrowR:    S('<path d="M5 12h14m-6-6 6 6-6 6"/>'),

/* ── State ── */
/* ── Storage with iOS fallback ── */
let _storageAvailable = false;
try {
  const t = '__test__';
  localStorage.setItem(t, '1');
  localStorage.removeItem(t);
  _storageAvailable = true;
} catch(e) {}

let ck = {};
if (_storageAvailable) {
  try { const s = localStorage.getItem('alv4'); if (s) ck = JSON.parse(s); } catch(e) {}
}
function save() {
  if (_storageAvailable) {
    try { localStorage.setItem('alv4', JSON.stringify(ck)); } catch(e) {}
  }
}

function progress(id) {
  const lv = DATA.find(l => l.id === id);
  const t = lv.skills.length;
  let d = 0;
  lv.skills.forEach((_, i) => { if (ck[id + '-' + i]) d++; });
  return { d, t, pct: t ? Math.round(d / t * 100) : 0 };
}


/* ── Render chips ── */
function renderChips() {
  document.getElementById('chips').innerHTML = DATA.map(l => {
    const p = progress(l.id);
    const done = p.pct === 100;
    return `<a href="#level-${l.id}" class="chip${done ? ' done' : ''}">
      <span class="chip-dot" style="${done ? 'background:var(--'+l.c+')' : ''}"></span>
      L${l.id} · ${l.label}
      <span class="chip-pct">${p.pct}%</span>
    </a>`;
  }).join('');
}


/* ── Render all levels ── */
function render() {
  const el = document.getElementById('main');
  let h = '';

  DATA.forEach((lv, idx) => {
    const c = lv.c;
    const p = progress(lv.id);

    if (idx > 0) h += '<div class="sep"></div>';

    h += `<section class="level" id="level-${lv.id}">`;

    /* Header */
    h += `<div class="lv-head">
      <div class="lv-num" style="background:var(--${c}-bg);color:var(--${c});border-color:var(--${c}b)">${lv.id}</div>
      <div class="lv-meta">
        <h2>${lv.title}</h2>
        <p>${lv.desc}</p>
      </div>
    </div>`;

    /* Diagram */
    h += `<div class="diagram" style="--dc:var(--${c})">
      <div class="dia-top">
        <span class="dia-label">Workflow</span>
        <div class="dia-legend">
          <span class="leg"><span class="leg-box" style="background:var(--${c}-bg);border:1.5px solid var(--${c})"></span> You</span>
          <span class="leg"><span class="leg-box" style="background:var(--${c}s)"></span> Agent</span>
        </div>
      </div>
      <div class="flow" style="--fc:var(--${c}b)">`;

    lv.flow.forEach((n, ni) => {
      if (ni > 0) h += `<div class="arr">${icon('chevR','var(--ink-4)')}</div>`;

      if (n.h) {
        h += `<div class="node human">
          <div class="node-circle" style="background:var(--${c}-bg);border:1.5px solid var(--${c}b);box-shadow:0 0 20px var(--${c}s);position:relative">
            ${icon(n.i,'var(--'+c+')')}
            <span style="position:absolute;top:-6px;right:-8px;font-size:7px;font-weight:700;letter-spacing:.1em;padding:2px 5px;border-radius:4px;line-height:1;background:var(--dc);color:var(--bg)">YOU</span>
          </div>
          <span class="node-text" style="color:var(--${c})">${n.t}</span>
        </div>`;
      } else {
        h += `<div class="node agent">
          <div class="node-circle" style="background:var(--${c}s);border:1px solid var(--${c}b)">
            ${icon(n.i,'var(--'+c+')')}
          </div>
          <span class="node-text" style="color:var(--ink-2)">${n.t}</span>
        </div>`;
      }
    });

    h += '</div></div>';

    /* Cards */
    h += '<div class="cards">';
    lv.cards.forEach(card => {
      h += `<div class="card">
        <div class="card-hd">
          <div class="card-ico" style="background:var(--${c}s)">${icon(card.i,'var(--'+c+')')}</div>
          <span class="card-title">${card.t}</span>
        </div>
        <ul>`;
      card.items.forEach(it => {
        h += `<li style="--dot:var(--${c})"><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--${c});opacity:.5;flex-shrink:0;margin-top:8px"></span>${it}</li>`;
      });
      h += '</ul></div>';
    });
    h += '</div>';

    /* Checklist */
    h += `<div class="checklist">
      <div class="cl-top">
        <span class="cl-label">${icon('school','var(--'+c+')')} Skills to master</span>
        <span class="cl-badge" id="pct-${lv.id}" style="background:var(--${c}s);color:var(--${c})">${p.pct}%</span>
      </div>
      <div class="cl-track"><div class="cl-fill" id="bar-${lv.id}" style="width:${p.pct}%;background:var(--${c})"></div></div>`;

    lv.skills.forEach((txt, si) => {
      const key = lv.id + '-' + si;
      const on = !!ck[key];
      h += `<div class="cl-row" data-key="${key}" data-lv="${lv.id}" data-c="${c}">
        <div class="cl-check${on?' on':''}" id="cb-${key}" style="${on?'background:var(--'+c+');border-color:var(--'+c+')':''}">
          ${icon('check','var(--bg)')}
        </div>
        <span class="cl-txt${on?' done':''}" id="ct-${key}">${txt}</span>
      </div>`;
    });
    h += '</div>';

    /* Next steps */
    h += `<div class="nextsteps">
      <div class="ns-title">${icon('rocket','var(--'+c+')')} ${lv.id < 5 ? 'How to reach level ' + (lv.id+1) : 'What comes next'}</div>`;

    lv.next.forEach((st, si) => {
      const last = si === lv.next.length - 1;
      h += `<div class="ns-item">
        <div class="ns-rail">
          <div class="ns-dot" style="border-color:var(--${c}b)"></div>
          ${!last ? `<div class="ns-line" style="background:var(--${c}s)"></div>` : ''}
        </div>
        <div class="ns-body">
          <strong>${st.s}</strong>
          <span>${st.d}</span>
        </div>
      </div>`;
    });
    h += '</div>';

    /* Nav to next level */
    if (lv.id < 5) {
      const nx = DATA[idx + 1];
      h += `<a href="#level-${nx.id}" class="go-next">
        <div class="go-badge" style="background:var(--${nx.c}-bg);color:var(--${nx.c})">${nx.id}</div>
        <div class="go-text">
          <div class="go-sub">Next level</div>
          <div class="go-name">${nx.title}</div>
        </div>
        ${icon('arrowR','var(--ink-4)')}
      </a>`;
    }

    h += '</section>';
  });

  el.innerHTML = h;

  /* Scroll observer */
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.06, rootMargin: '0px 0px -50px 0px' });
  document.querySelectorAll('.level').forEach(s => obs.observe(s));
}


/* ── Toggle checkbox (event delegation) ── */
document.addEventListener('click', e => {
  const row = e.target.closest('.cl-row');
  if (!row) return;

  const key = row.dataset.key;
  const lvId = parseInt(row.dataset.lv);
  const c = row.dataset.c;

  ck[key] = !ck[key];
  save();

  const on = ck[key];
  const cb = document.getElementById('cb-' + key);
  const ct = document.getElementById('ct-' + key);

  cb.className = 'cl-check' + (on ? ' on' : '');
  cb.style.background = on ? `var(--${c})` : '';
  cb.style.borderColor = on ? `var(--${c})` : '';
  ct.className = 'cl-txt' + (on ? ' done' : '');

  const p = progress(lvId);
  document.getElementById('pct-' + lvId).textContent = p.pct + '%';
  document.getElementById('bar-' + lvId).style.width = p.pct + '%';
  renderChips();
});


/* ── Init ── */
renderChips();
render();

/* Show notice if storage unavailable */
if (!_storageAvailable) {
  const notice = document.createElement('div');
  notice.style.cssText = 'text-align:center;padding:10px 20px;font-size:11px;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--surface-4);position:fixed;top:0;left:0;right:0;z-index:99';
  notice.innerHTML = 'Checklist progress won\u2019t be saved in this session. <a href="#" style="color:var(--gold);text-decoration:underline;text-underline-offset:2px" onclick="this.parentElement.remove();return false">Dismiss</a>';
  document.body.prepend(notice);
}
</script>
